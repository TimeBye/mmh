name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build darwin amd64 / arm64 / universal
        run: bash .cross_compile.sh

      - name: inspect artifacts
        run: |
          lipo -info dist/mmh_darwin_universal
          file dist/mmh_darwin_amd64 dist/mmh_darwin_arm64 dist/mmh_darwin_universal
          cat dist/checksums.txt

      - name: smoke test
        run: dist/mmh_darwin_arm64 version

      - uses: actions/upload-artifact@v4
        with:
          name: mmh-darwin
          path: dist/

      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/mmh_darwin_* dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
